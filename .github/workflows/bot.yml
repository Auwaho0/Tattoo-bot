name: EverArt Bot

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: everart-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Восстановление кэша venv
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: bot/.venv
          key: ${{ runner.os }}-py311-venv-${{ hashFiles('bot/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-venv-

      - name: ⚡ Установка uv
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: 🛠 Создание venv и установка зависимостей
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: bot
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          echo "✅ Зависимости установлены"

      - name: 💾 Сохранение кэша venv
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bot/.venv
          key: ${{ runner.os }}-py311-venv-${{ hashFiles('bot/requirements.txt') }}

      - name: 🦇 Запуск бота (до 5ч40м)
        working-directory: bot
        env:
          BOT_TOKEN:    ${{ secrets.BOT_TOKEN }}
          ADMIN_ID:     ${{ secrets.ADMIN_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .venv/bin/activate
          echo "🐍 Python: $(python --version)"
          echo "📅 Старт: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          set +e
          timeout 340m python -m app.main
          STATUS=$?
          set -e

          echo "📅 Конец: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [ "$STATUS" -eq 124 ]; then
            echo "⏰ Бот остановлен по таймауту (нормальное завершение)"
            exit 0
          elif [ "$STATUS" -ne 0 ]; then
            echo "❌ Бот упал с кодом $STATUS"
            exit "$STATUS"
          else
            echo "✅ Бот завершился штатно (код 0)"
          fi