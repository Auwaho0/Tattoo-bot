name: EverArt Bot

on:
  schedule:
    - cron: "0 */5 * * *"   # каждые 5 часов
  workflow_dispatch:

concurrency:
  group: everart-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Восстановление кэша venv
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: bot/.venv
          key: ${{ runner.os }}-py311-venv-${{ hashFiles('bot/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-venv-

      - name: ⚡ Установка uv
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: 🛠 Создание venv и установка зависимостей
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: bot
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          echo "✅ Зависимости установлены"

      - name: 💾 Сохранение кэша venv
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bot/.venv
          key: ${{ runner.os }}-py311-venv-${{ hashFiles('bot/requirements.txt') }}

      # ─── УВЕДОМЛЕНИЕ О СТАРТЕ ───
      - name: 📢 Уведомление о запуске бота
        env:
          TG_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "⚠️ TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID не заданы — пропускаем"
            exit 0
          fi
          TEXT="🟢 *EverArt Bot запущен*%0A📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="MarkdownV2" \
            -d text="${TEXT}" \
            || echo "⚠️ Не удалось отправить уведомление о старте"

      - name: 🦇 Запуск бота (до 5ч40м)
        id: bot_run
        working-directory: bot
        env:
          BOT_TOKEN:    ${{ secrets.BOT_TOKEN }}
          ADMIN_ID:     ${{ secrets.ADMIN_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source .venv/bin/activate
          echo "🐍 Python: $(python --version)"
          echo "📅 Старт: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          set +e
          timeout 340m python -m app.main
          STATUS=$?
          set -e

          echo "📅 Конец: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [ "$STATUS" -eq 124 ]; then
            echo "⏰ Бот остановлен по таймауту (нормальное завершение)"
            echo "BOT_EXIT_REASON=timeout" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$STATUS" -ne 0 ]; then
            echo "❌ Бот упал с кодом $STATUS"
            echo "BOT_EXIT_REASON=error" >> "$GITHUB_OUTPUT"
            echo "BOT_EXIT_CODE=$STATUS" >> "$GITHUB_OUTPUT"
            exit "$STATUS"
          else
            echo "✅ Бот завершился штатно (код 0)"
            echo "BOT_EXIT_REASON=ok" >> "$GITHUB_OUTPUT"
          fi

      # ─── УВЕДОМЛЕНИЕ О ЗАВЕРШЕНИИ ───
      - name: 📢 Уведомление о завершении бота
        if: always()   # срабатывает даже если предыдущий шаг упал
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "⚠️ TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID не заданы — пропускаем"
            exit 0
          fi

          # Определяем причину завершения
          if [ "${{ steps.bot_run.outputs.BOT_EXIT_REASON }}" = "timeout" ]; then
            ICON="⏰"
            REASON="Остановлен по таймауту"
          elif [ "${{ steps.bot_run.outputs.BOT_EXIT_REASON }}" = "error" ]; then
            ICON="❌"
            REASON="Ошибка (код ${{ steps.bot_run.outputs.BOT_EXIT_CODE }})"
          else
            ICON="🟡"
            REASON="Штатное завершение"
          fi

          TEXT="${ICON} *EverArt Bot остановлен*%0A📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')%0A📝 ${REASON}%0A🔄 Следующий запуск — по расписанию (возможна задержка 1–3ч)"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="MarkdownV2" \
            -d text="${TEXT}" \
            || echo "⚠️ Не удалось отправить уведомление о завершении"