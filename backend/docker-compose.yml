services:
  everart:
    build: .
    container_name: everart-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [ everart ]

  db:
    image: postgres:16-alpine
    container_name: everart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: everart
      POSTGRES_PASSWORD: everart_pass
      POSTGRES_DB: everart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U everart" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ everart ]

volumes:
  pgdata:

networks:
  everart:
    driver: bridge
